# The quality gate on every pull request and on main. No secrets and no traffic to TClock:
# `npm run gate` only collects the tests, it never runs them.
name: Quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_REF: ${{ github.base_ref || 'main' }}
    steps:
      # Full history: the integrity check compares every spec against the merge base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The integrity check skips itself when the base is missing, so a missing base must
      # fail here instead of passing unnoticed.
      - name: Check the base branch exists
        run: git rev-parse --verify "origin/$BASE_REF"
      - name: Run the quality gate
        run: npm run gate -- --base "origin/$BASE_REF"
      - name: Publish the gate result and the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: quality-gate
          path: |
            .orchestrate/gate.json
            .orchestrate/coverage-report.md
          include-hidden-files: true
          retention-days: 14
